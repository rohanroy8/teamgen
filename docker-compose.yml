services:
  db:
    image: pgvector/pgvector:pg16
    container_name: teamgen-db
    environment:
      POSTGRES_USER: teamgen
      POSTGRES_PASSWORD: teamgen
      POSTGRES_DB: teamgen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamgen"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
